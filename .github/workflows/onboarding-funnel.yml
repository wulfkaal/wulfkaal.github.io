name: Onboarding funnel

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch privacy-preserving public funnel
        run: python3 onboard.py funnel --days 30 > onboarding-funnel.json
      - name: Validate snapshot
        run: python3 -m json.tool onboarding-funnel.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-funnel-${{ github.run_id }}
          path: onboarding-funnel.json
          retention-days: 30
