# .github/workflows/corpus-projections.yml
#
# Lever L03 + L02, automated on your side rather than through an agent.
#
# Two jobs:
#   projections — regenerate every file that is a pure function of the corpus,
#                 and commit only if the bytes actually changed.
#   integrity   — re-run the checks that found this cycle's defects, and FAIL
#                 the build if any of them come back.
#
# The second job is the durable win. A defect that becomes a red check cannot
# silently return six months from now; a defect that lives in a report can.
#
# No agent needs write access to this repository for any of it.

name: corpus projections

on:
  push:
    branches: [main]
    paths:
      - 'claims/all.jsonl'
      - 'claims/index.json'
      - 'claims/index.html'
      - 'claims/by-topic/**'
      - 'failures/**'
      - 'positions-src/**'
      - 'positions/**'
      - 'rank.json'
      - 'papers.json'
      - 'colloquium/jobs.json'
      - 'tools/**'
      - 'agentic-claim-graph/**'
      - '.github/workflows/corpus-projections.yml'
  pull_request:
    paths:
      - 'claims/**'
      - 'failures/**'
      - 'positions/**'
      - 'rank.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.well-known/**'
      - 'colloquium/index.json'
      - 'colloquium/jobs.json'
      - 'colloquium/tasks/**'
      - 'client.py'
      - 'tests/**'
      - 'afmr/schemas/**'
      - 'agentic-claim-graph/**'
  workflow_dispatch:
  schedule:
    # Weekly drift check: catches anything that changed outside this workflow.
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: corpus-projections
  cancel-in-progress: false

jobs:
  projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Regenerate rank.md from rank.json
        run: python3 tools/make_rank_md.py rank.json > rank.md

      # --with-quote is REQUIRED, not optional. Without it this job would strip
      # the verbatim supporting_quote from the protected baseline on the next corpus
      # change -- a projection job silently undoing a deliberate decision is the
      # exact failure mode this workflow exists to prevent.
      - name: Re-enrich claims/index.json from claims/all.jsonl
        run: |
          python3 tools/enrich_claims_index.py --with-quote \
            --index-url  claims/index.json \
            --corpus-url claims/all.jsonl \
            --out        claims/index.json

      - name: Regenerate enumerable claim-topic projections
        run: python3 tools/build_claim_topic_index.py

      - name: Normalize claim canonicals and search sitemap
        run: python3 tools/normalize_claim_discovery.py

      - name: Regenerate the paged Colloquium activation feed
        run: python3 tools/build_colloquium_tasks.py

      - name: Regenerate public position discovery surfaces
        run: python3 tools/build_positions.py

      - name: Enforce source-only ownership for compound-growth commits
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" != *"[kaal-growth]"* ]]; then
            exit 0
          fi
          python3 - <<'PY'
          import subprocess, sys
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True
          ).splitlines()
          forbidden = [path for path in changed if not path.startswith("positions-src/")]
          if forbidden:
              sys.exit("compound-growth publisher changed CI-owned paths: " + ", ".join(forbidden))
          if not changed:
              sys.exit("compound-growth source commit changed no position source records")
          print(f"source-only ownership verified for {len(changed)} path(s)")
          PY

      - name: Validate generated discovery projections before push
        run: |
          python3 -m unittest \
            tests/test_claim_notifier.py \
            tests/test_claim_topic_discoverability.py \
            tests/test_corpus_count_projections.py \
            tests/test_position_discoverability.py \
            tests/test_position_notifier.py \
            tests/test_sitemap_integrity.py
          python3 tools/build_claim_topic_index.py --check
          python3 tools/normalize_claim_discovery.py --check

      - name: Derive the published corpus counts from the corpus
        # authority.json and the agent cards each restate the corpus size, and
        # nothing derived them, so they drifted: authority.json's `works` froze
        # at 126 on 2026-08-10 while the index went on to 132, and the aliases
        # were stuck at 124 with an ssrn_records of 129. This makes those numbers
        # a function of claims/index.json and papers.json. It also FAILS the run
        # if a claim cites a source digest papers.json does not list, which is
        # how a three-character transcription error in one digest hid a covered
        # work for weeks.
        run: python3 tools/derive_corpus_counts.py

      - name: Regenerate rank prose after count derivation
        run: python3 tools/make_rank_md.py rank.json > rank.md

      - name: Synchronize sitemap content dates and enforce one owner per URL
        run: |
          python3 tools/sync_sitemap_index.py
          python3 tools/check_sitemap_uniqueness.py

      - name: Commit only if something actually changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- authority.json .well-known/agent.json .well-known/ai-agent.json rank.json rank.md rank.jsonld llms.txt llms-full.txt claims/index.json claims/*.html claims/by-topic/index.json claims/by-topic/*.html colloquium/tasks positions sitemap-claims.xml sitemap-colloquium.xml sitemap-positions.xml sitemap-index.xml sitemap-index-state.json agent-card.json .well-known/agent-card.json .well-known/colloquium.jsonld .well-known/mcp.json; then
            echo "projections already current; nothing to commit"
            exit 0
          fi
          git config user.name  "corpus-projections[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authority.json .well-known/agent.json .well-known/ai-agent.json rank.json rank.md rank.jsonld llms.txt llms-full.txt claims/index.json 'claims/*.html' claims/by-topic/index.json 'claims/by-topic/*.html' colloquium/tasks positions sitemap-claims.xml sitemap-colloquium.xml sitemap-positions.xml sitemap-index.xml sitemap-index-state.json agent-card.json .well-known/agent-card.json .well-known/colloquium.jsonld .well-known/mcp.json
          git commit -m "Regenerate projections from the corpus"
          git push

  integrity:
    needs: projections
    if: always() && needs.projections.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Every URL this repo advertises must resolve
        if: github.event_name != 'push'
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request, concurrent.futures as cf
          BASE = "https://wulfkaal.github.io"
          UA = {"User-Agent": "corpus-integrity-ci/1.0"}

          urls = set(re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read()))
          col = json.load(open("colloquium/index.json"))
          for k, v in (col.get("read_surface") or {}).items():
              if isinstance(v, str) and v.startswith("http") and "<" not in v:
                  # Read-surface entries may append a human-readable parenthetical
                  # after the URL. Probe the URL token, not the annotation.
                  urls.add(v.split()[0])

          def head(u):
              try:
                  r = urllib.request.Request(u, method="HEAD", headers=UA)
                  return u, urllib.request.urlopen(r, timeout=45).status
              except Exception as e:
                  code = getattr(e, "code", None)
                  return u, code or f"ERR {type(e).__name__}"

          bad = []
          with cf.ThreadPoolExecutor(max_workers=8) as ex:
              for u, s in ex.map(head, sorted(urls)):
                  mark = "ok " if s == 200 else "DEAD"
                  print(f"{mark} {s} {u}")
                  if s != 200:
                      bad.append((u, s))
          if bad:
              print(f"\n{len(bad)} advertised URL(s) do not resolve.")
              print("A dead link inside a sitemap or a self-describing service state is the")
              print("first thing a crawler resolves, and it discounts every sibling URL.")
              sys.exit(1)
          PY

      - name: The colloquium's declared ledger hash must match the ledger
        run: |
          python3 - <<'PY'
          import hashlib, json, sys, pathlib
          d = json.load(open("colloquium/index.json"))
          declared = (d.get("read_surface") or {}).get("ledger_sha256")
          p = pathlib.Path("colloquium/ledger.jsonl")
          actual = hashlib.sha256(p.read_bytes() if p.exists() else b"").hexdigest()
          print("declared", declared, "\nactual  ", actual)
          if declared and declared != actual:
              sys.exit("ledger_sha256 does not match ledger.jsonl. A wrong hash on a "
                       "self-verifying surface is worse than no hash at all.")
          PY

      - name: Every failure-mode claim must be classified into a family
        run: |
          python3 - <<'PY'
          import json, os, re, sys, collections

          claims = json.load(open("claims/index.json"))
          index = json.load(open("failures/index.json"))

          flagged = {c["id"] for c in claims["claims"] if c.get("is_failure_mode")}
          covered = {f["id"] for f in index["failures"]}
          missing, stray = flagged - covered, covered - flagged

          fams = {m["failure_family"] for m in index["modes"]}
          by_name = {f[:-5] for f in os.listdir("failures/by-name") if f.endswith(".json")}
          pages = {f[:-5] for f in os.listdir("failures") if f.endswith(".html")} - {"index"}
          sitemap = set(re.findall(r"failures/([a-z0-9-]+)\.html",
                                   open("sitemap-claims.xml").read())) - {"index"}

          fail = []
          if missing:
              papers = collections.Counter(i.split(":")[2].rsplit("-", 1)[0] for i in missing)
              fail.append(
                  f"{len(missing)} failure-mode claims are not in failures/index.json, from "
                  + ", ".join(f"{k} ({v})" for k, v in papers.most_common()))
          if stray:
              fail.append(f"{len(stray)} entries in failures/index.json are not failure-mode claims")
          if index["count"] != len(index["failures"]):
              fail.append(f'index declares {index["count"]} records but carries {len(index["failures"])}')
          if index["families"] != len(fams):
              fail.append(f'index declares {index["families"]} families but carries {len(fams)}')
          for label, got in (("by-name documents", by_name), ("HTML pages", pages),
                             ("sitemap entries", sitemap)):
              if got != fams:
                  fail.append(f"{label} do not match the family list: "
                              f"missing {sorted(fams - got)}, extra {sorted(got - fams)}")

          print(f"failure-mode claims {len(flagged)}, classified {len(covered)}, families {len(fams)}")
          if not fail:
              print("failure layer covers the claim layer")
              raise SystemExit(0)
          for line in fail:
              print("FAIL:", line)
          print()
          print("The failure layer is generated separately from the claim layer, so it goes")
          print("stale silently: on 2026-09-05 it still covered 2,037 of 2,080 claims, three")
          print("weeks after the papers that produced the other 43 were ingested, and nothing")
          print("said so. Regenerate with tools/build_failure_index.py --classify <file>,")
          print("where the file assigns a family and a specific_name to each new claim. That")
          print("assignment is a judgement and is deliberately not automated.")
          sys.exit(1)
          PY

      - name: The positions layer must agree with itself, and withdrawals must stay withdrawn
        run: |
          python3 - <<'PY'
          import json, os, re, sys, collections

          status = {}
          for f in os.listdir("positions"):
              if f.endswith(".json") and f[0].isdigit():
                  status[f[:-5]] = json.load(open(f"positions/{f}")).get("creativeWorkStatus")
          affirmed = {k for k, v in status.items() if v == "Affirmed"}
          withdrawn = {k for k, v in status.items() if v != "Affirmed"}

          index = json.load(open("positions/index.json"))
          listed = {e["@id"].rsplit("/", 1)[-1] for e in index["itemListElement"]}
          bulk = sum(1 for _ in open("positions/all.jsonl"))
          sitemap = set(re.findall(r"positions/(\d[\w-]*)", open("sitemap-positions.xml").read()))

          fail = []
          if affirmed != listed:
              fail.append(f"affirmed records and the index disagree: "
                          f"{len(affirmed - listed)} on disk but unlisted, "
                          f"{len(listed - affirmed)} listed but not affirmed on disk")
          if index["numberOfItems"] != len(index["itemListElement"]):
              fail.append(f'index declares {index["numberOfItems"]} items but carries '
                          f'{len(index["itemListElement"])}')
          if bulk != len(listed):
              fail.append(f"all.jsonl has {bulk} rows against {len(listed)} indexed positions")
          if sitemap != listed:
              fail.append(f"sitemap and index disagree: missing {len(listed - sitemap)}, "
                          f"extra {len(sitemap - listed)}")

          # The withdrawal invariant. Withdrawn positions stay resolvable at their
          # permanent URLs so existing citations do not 404, but they must never be
          # advertised. Both halves matter and neither is the default.
          leaked = sorted((withdrawn & listed) | (withdrawn & sitemap))
          if leaked:
              fail.append(f"{len(leaked)} withdrawn positions are still advertised, e.g. {leaked[:3]}")
          for stem in sorted(listed):
              missing = [e for e in (".json", ".md", ".html") if not os.path.exists(f"positions/{stem}{e}")]
              if missing:
                  fail.append(f"indexed position {stem} is missing {missing}")
                  break

          # The count is published in five places as of 2026-09-06. Every one must
          # agree with the layer, and every one must actually carry the field -- a
          # silently absent field is how the cards drifted apart in August.
          published = {"authority.json": ("public_positions", "count")}
          for card in ("agent-card.json", ".well-known/agent-card.json",
                       ".well-known/agent.json", ".well-known/ai-agent.json"):
              published[card] = ("corpus", "public_positions")
          for path, (block, field) in published.items():
              doc = json.load(open(path)).get(block) or {}
              if field not in doc:
                  fail.append(f"{path} does not publish {block}.{field}")
              elif doc[field] != len(listed):
                  fail.append(f"{path} publishes {block}.{field}={doc[field]} "
                              f"against {len(listed)} indexed positions")

          print(f"positions: {len(affirmed)} affirmed, {len(withdrawn)} withdrawn, "
                f"{len(listed)} indexed, {bulk} bulk rows, {len(sitemap)} sitemap urls, "
                f"published in {len(published)} files")
          if not fail:
              print("positions layer is self-consistent and no withdrawal is advertised")
              raise SystemExit(0)
          for line in fail:
              print("FAIL:", line)
          print()
          print("The positions layer is 8,354 records - the largest part of the public claim")
          print("surface and, until 2026-09-06, the only layer with no reconciliation at all.")
          print("Regenerate with tools/build_positions.py from positions-src/.")
          print()
          print("If the failure is withdrawn records appearing on disk but not in the index,")
          print("that is CORRECT and this check should not have fired: batch 0014 withdrew")
          print("eight positions on 2026-08-01 and they remain resolvable on purpose. Never")
          print("delete them and never re-add them to the index to make a count line up.")
          sys.exit(1)
          PY

      - name: No AI crawler may be disallowed, and the search-side ones must be named
        run: |
          python3 - <<'PY'
          import re, sys
          txt = open("robots.txt").read()
          must_allow = ["GPTBot","OAI-SearchBot","ChatGPT-User","ClaudeBot",
                        "Claude-SearchBot","Claude-User","PerplexityBot","Applebot",
                        "Googlebot","Google-Extended","CCBot","Amazonbot"]
          blocked = [b for b in must_allow
                     if re.search(rf"User-agent:\s*{re.escape(b)}\s*\n\s*Disallow:\s*/\s*$",
                                  txt, re.I|re.M)]
          if blocked:
              sys.exit(f"robots.txt disallows: {blocked}. Blocking search-side crawlers "
                       "removes this corpus from cited answers.")
          named = [b for b in ("OAI-SearchBot","Claude-SearchBot","PerplexityBot","Applebot")
                   if re.search(rf"User-agent:\s*{re.escape(b)}", txt, re.I)]
          missing = set(("OAI-SearchBot","Claude-SearchBot","PerplexityBot","Applebot")) - set(named)
          if missing:
              sys.exit(f"search-side crawlers not named explicitly: {sorted(missing)}")
          print("robots.txt posture OK")
          PY

      - name: The plugin manifest must not lie about its own API
        run: |
          python3 - <<'PY'
          import json, os, sys
          p = ".well-known/ai-plugin.json"
          if not os.path.exists(p):
              print("no legacy manifest; nothing to check"); sys.exit(0)
          m = json.load(open(p))
          api = m.get("api") or {}
          if api.get("type") == "openapi" and not api.get("url","").endswith((".yaml",".yml",".json")):
              sys.exit(f'api.type=openapi but api.url={api.get("url")} is not an OpenAPI document')
          print("manifest OK")
          PY

      - name: Every claim entry in the bulk index must carry its citation
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("claims/index.json"))
          claims = d.get("claims", [])
          missing = [c["id"] for c in claims if not c.get("citation")][:10]
          noquote = [c["id"] for c in claims if not c.get("supporting_quote")][:10]
          print(f"{len(claims)} entries")
          if noquote:
              sys.exit("entries without a verbatim supporting_quote, e.g. " +
                       ", ".join(noquote) + "\nAn agent holding only the index could "
                       "then cite the claim restatement but not the source. Run "
                       "tools/enrich_claims_index.py --with-quote.")
          if missing:
              sys.exit("entries without a citation string, e.g. " + ", ".join(missing) +
                       "\nAn index of quotable assertions with no attribution attached is "
                       "the condition under which a model paraphrases without citing. "
                       "Run tools/enrich_claims_index.py.")
          print("every entry is attributable on its own")
          PY

      - name: The SSRN roster and its citation projection must remain complete
        run: |
          python3 - <<'PY'
          import json, re, sys

          papers = json.load(open("papers.json"))
          works = papers.get("works", [])
          ssrn_ids = [w.get("ssrn_id") for w in works]
          bib_entries = re.findall(r"^@\w+\{", open("papers.bib").read(), re.M)

          expected = 134
          problems = []
          if papers.get("count") != expected or len(works) != expected:
              problems.append(f"papers.json roster is {papers.get('count')}/{len(works)}, expected {expected}")
          if papers.get("count_with_ssrn_id") != expected:
              problems.append(f"count_with_ssrn_id is {papers.get('count_with_ssrn_id')}, expected {expected}")
          if any(not value for value in ssrn_ids) or len(set(ssrn_ids)) != expected:
              problems.append("SSRN identifiers are missing or duplicated")
          if len(bib_entries) != expected:
              problems.append(f"papers.bib has {len(bib_entries)} entries, expected {expected}")
          if papers.get("claim_covered_work_count") != 132:
              problems.append("claim_covered_work_count must remain explicit at 132 until ingestion expands")

          if problems:
              sys.exit("\n".join(problems))
          print("134 unique SSRN records; 134 BibTeX entries; 132 claim-covered works")
          PY

      - name: Spot-check that quotes are still verbatim and hashes still bind
        run: python3 verify.py --sample 12 --no-pdf

      - name: Colloquium onboarding contracts and CLI stay executable
        run: |
          python3 tools/build_colloquium_tasks.py --check
          python3 -m unittest tests/test_colloquium_client.py

      - name: Position discovery projections remain exact and fail closed
        run: |
          python3 -m unittest \
            tests/test_corpus_count_projections.py \
            tests/test_position_discoverability.py \
            tests/test_position_notifier.py

      - name: The graph release chain must close
        run: |
          pip install --quiet cryptography
          python3 tools/verify_graph_release.py agentic-claim-graph/v1

      - name: AFMR Lift Harness schemas remain strict and resolvable
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("afmr/schemas")
          expected = {
              "lift-comparison-manifest-v1.schema.json",
              "lift-comparison-public-card-v1.schema.json",
              "lift-comparison-public-card-index-v1.schema.json",
          }
          for name in expected:
              schema = json.loads((root / name).read_text())
              assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              assert schema["$id"].endswith("/afmr/schemas/" + name)
              assert schema["additionalProperties"] is False
          catalog = json.loads((root / "index.json").read_text())
          advertised = {url.rsplit("/", 1)[-1] for url in catalog["schemas"].values()}
          if advertised != expected:
              sys.exit(f"schema catalog drift: {advertised} != {expected}")
          print("AFMR Lift Harness schema catalog OK")
          PY

      - name: Every sitemap must announce its real last-modified date
        run: |
          python3 tools/sync_sitemap_index.py --check
          python3 tools/check_sitemap_uniqueness.py

      - name: Every claim topic must be enumerable, not merely guessable
        run: |
          python3 -m unittest \
            tests/test_claim_notifier.py \
            tests/test_claim_topic_discoverability.py \
            tests/test_sitemap_integrity.py
          python3 tools/normalize_claim_discovery.py --check
          python3 tools/build_claim_topic_index.py --check
          python3 - <<'PY'
          import json, pathlib, sys
          # A published index that nothing points at is still undiscoverable. Before this
          # check existed, 29 topic slices covering 11,256 claim-topic tags were live and
          # only 8 slugs appeared in any agent entry point, so 67% of the layer was
          # reachable only by guessing a URL.
          url = "https://wulfkaal.github.io/claims/by-topic/index.json"
          problems = []

          for name in ("agent-card.json", ".well-known/agent-card.json"):
              card = json.loads(pathlib.Path(name).read_text())
              if card["corpus"].get("claim_topic_index") != url:
                  problems.append(f"{name} does not advertise the claim topic index")
          if (pathlib.Path("agent-card.json").read_bytes()
                  != pathlib.Path(".well-known/agent-card.json").read_bytes()):
              problems.append("the two agent cards have diverged")

          mcp = json.loads(pathlib.Path(".well-known/mcp.json").read_text())
          if mcp["staticMirror"].get("claimTopicIndex") != url:
              problems.append(".well-known/mcp.json staticMirror omits claimTopicIndex")

          if url not in pathlib.Path("llms.txt").read_text():
              problems.append("llms.txt does not name the claim topic index")

          index = json.loads(pathlib.Path("claims/by-topic/index.json").read_text())
          for shard in index["shards"]:
              slug = shard["topic"]
              path = pathlib.Path("claims/by-topic") / f"{slug}.json"
              if not path.exists():
                  problems.append(f"index lists {slug} but {path} is missing")
                  continue
              if shard["json"] != f"https://wulfkaal.github.io/claims/by-topic/{slug}.json":
                  problems.append(f"{slug}: index url does not match its slug")
              # Reachable for a person too. A topic that answers only in JSON is
              # machine-readable, not readable.
              page = pathlib.Path("claims/by-topic") / f"{slug}.html"
              if not page.exists():
                  problems.append(f"{slug} has no human page")
          if not pathlib.Path("claims/by-topic/index.html").exists():
              problems.append("the topic layer has no human entry point")

          # The shards list bare ids; the index publishes the id->url transform. A
          # template nobody exercises is a template that rots, so apply it to a real
          # claim from a real shard and require the identifier to come back matching.
          prefix = index["claimIdPrefix"]
          template = index["claimJsonUrlTemplate"]
          first = index["shards"][0]["topic"]
          ids = json.loads(
              (pathlib.Path("claims/by-topic") / f"{first}.json").read_text())["claims"]
          sample = ids[0]
          if not sample.startswith(prefix):
              problems.append(f"{sample!r} does not carry the declared prefix {prefix!r}")
          else:
              want = f"https://wulfkaal.github.io/claims/{sample[len(prefix):]}.json"
              if template.replace("{id_without_prefix}", sample[len(prefix):]) != want:
                  problems.append("claimJsonUrlTemplate does not produce a canonical URL")
          ex = index["example"]
          if not ex["json"].endswith(f"{ex['claimId'][len(prefix):]}.json"):
              problems.append("the published example is internally inconsistent")

          if problems:
              for problem in problems:
                  print("  " + problem, file=sys.stderr)
              sys.exit("the claim topic layer is published but not discoverable")
          print(f"claim topic layer discoverable: {index['count']} topics, "
                f"{index['totalClaimTopicTags']} tags, advertised in 4 entry points, "
                f"id->url transform published and exercised")
