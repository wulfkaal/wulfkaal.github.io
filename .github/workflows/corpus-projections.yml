# .github/workflows/corpus-projections.yml
#
# Lever L03 + L02, automated on your side rather than through an agent.
#
# Two jobs:
#   projections — regenerate every file that is a pure function of the corpus,
#                 and commit only if the bytes actually changed.
#   integrity   — re-run the checks that found this cycle's defects, and FAIL
#                 the build if any of them come back.
#
# The second job is the durable win. A defect that becomes a red check cannot
# silently return six months from now; a defect that lives in a report can.
#
# No agent needs write access to this repository for any of it.

name: corpus projections

on:
  push:
    branches: [main]
    paths:
      - 'claims/all.jsonl'
      - 'claims/index.json'
      - 'positions-src/**'
      - 'rank.json'
      - 'papers.json'
      - 'colloquium/jobs.json'
      - 'tools/**'
      - 'agentic-claim-graph/**'
      - '.github/workflows/corpus-projections.yml'
  pull_request:
    paths:
      - 'claims/**'
      - 'rank.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.well-known/**'
      - 'colloquium/index.json'
      - 'colloquium/jobs.json'
      - 'colloquium/tasks/**'
      - 'client.py'
      - 'tests/**'
      - 'afmr/schemas/**'
      - 'agentic-claim-graph/**'
  workflow_dispatch:
  schedule:
    # Weekly drift check: catches anything that changed outside this workflow.
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: corpus-projections
  cancel-in-progress: false

jobs:
  projections:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Regenerate rank.md from rank.json
        run: python3 tools/make_rank_md.py rank.json > rank.md

      # --with-quote is REQUIRED, not optional. Without it this job would strip
      # the verbatim supporting_quote from all 5,145 entries on the next corpus
      # change -- a projection job silently undoing a deliberate decision is the
      # exact failure mode this workflow exists to prevent.
      - name: Re-enrich claims/index.json from claims/all.jsonl
        run: |
          python3 tools/enrich_claims_index.py --with-quote \
            --index-url  claims/index.json \
            --corpus-url claims/all.jsonl \
            --out        claims/index.json

      - name: Regenerate the paged Colloquium activation feed
        run: python3 tools/build_colloquium_tasks.py

      - name: Regenerate public position discovery surfaces
        run: python3 tools/build_positions.py

      - name: Commit only if something actually changed
        run: |
          if git diff --quiet -- rank.md claims/index.json claims/*.html colloquium/tasks positions sitemap-positions.xml sitemap-index.xml agent-card.json .well-known/agent-card.json .well-known/colloquium.jsonld; then
            echo "projections already current; nothing to commit"
            exit 0
          fi
          git config user.name  "corpus-projections[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rank.md claims/index.json 'claims/*.html' colloquium/tasks positions sitemap-positions.xml sitemap-index.xml agent-card.json .well-known/agent-card.json .well-known/colloquium.jsonld
          git commit -m "Regenerate projections from the corpus [skip ci]"
          git push

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Every URL this repo advertises must resolve
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request, concurrent.futures as cf
          BASE = "https://wulfkaal.github.io"
          UA = {"User-Agent": "corpus-integrity-ci/1.0"}

          urls = set(re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read()))
          col = json.load(open("colloquium/index.json"))
          for k, v in (col.get("read_surface") or {}).items():
              if isinstance(v, str) and v.startswith("http") and "<" not in v:
                  # Read-surface entries may append a human-readable parenthetical
                  # after the URL. Probe the URL token, not the annotation.
                  urls.add(v.split()[0])

          def head(u):
              try:
                  r = urllib.request.Request(u, method="HEAD", headers=UA)
                  return u, urllib.request.urlopen(r, timeout=45).status
              except Exception as e:
                  code = getattr(e, "code", None)
                  return u, code or f"ERR {type(e).__name__}"

          bad = []
          with cf.ThreadPoolExecutor(max_workers=8) as ex:
              for u, s in ex.map(head, sorted(urls)):
                  mark = "ok " if s == 200 else "DEAD"
                  print(f"{mark} {s} {u}")
                  if s != 200:
                      bad.append((u, s))
          if bad:
              print(f"\n{len(bad)} advertised URL(s) do not resolve.")
              print("A dead link inside a sitemap or a self-describing service state is the")
              print("first thing a crawler resolves, and it discounts every sibling URL.")
              sys.exit(1)
          PY

      - name: The colloquium's declared ledger hash must match the ledger
        run: |
          python3 - <<'PY'
          import hashlib, json, sys, pathlib
          d = json.load(open("colloquium/index.json"))
          declared = (d.get("read_surface") or {}).get("ledger_sha256")
          p = pathlib.Path("colloquium/ledger.jsonl")
          actual = hashlib.sha256(p.read_bytes() if p.exists() else b"").hexdigest()
          print("declared", declared, "\nactual  ", actual)
          if declared and declared != actual:
              sys.exit("ledger_sha256 does not match ledger.jsonl. A wrong hash on a "
                       "self-verifying surface is worse than no hash at all.")
          PY

      - name: No AI crawler may be disallowed, and the search-side ones must be named
        run: |
          python3 - <<'PY'
          import re, sys
          txt = open("robots.txt").read()
          must_allow = ["GPTBot","OAI-SearchBot","ChatGPT-User","ClaudeBot",
                        "Claude-SearchBot","Claude-User","PerplexityBot","Applebot",
                        "Googlebot","Google-Extended","CCBot","Amazonbot"]
          blocked = [b for b in must_allow
                     if re.search(rf"User-agent:\s*{re.escape(b)}\s*\n\s*Disallow:\s*/\s*$",
                                  txt, re.I|re.M)]
          if blocked:
              sys.exit(f"robots.txt disallows: {blocked}. Blocking search-side crawlers "
                       "removes this corpus from cited answers.")
          named = [b for b in ("OAI-SearchBot","Claude-SearchBot","PerplexityBot","Applebot")
                   if re.search(rf"User-agent:\s*{re.escape(b)}", txt, re.I)]
          missing = set(("OAI-SearchBot","Claude-SearchBot","PerplexityBot","Applebot")) - set(named)
          if missing:
              sys.exit(f"search-side crawlers not named explicitly: {sorted(missing)}")
          print("robots.txt posture OK")
          PY

      - name: The plugin manifest must not lie about its own API
        run: |
          python3 - <<'PY'
          import json, os, sys
          p = ".well-known/ai-plugin.json"
          if not os.path.exists(p):
              print("no legacy manifest; nothing to check"); sys.exit(0)
          m = json.load(open(p))
          api = m.get("api") or {}
          if api.get("type") == "openapi" and not api.get("url","").endswith((".yaml",".yml",".json")):
              sys.exit(f'api.type=openapi but api.url={api.get("url")} is not an OpenAPI document')
          print("manifest OK")
          PY

      - name: Every claim entry in the bulk index must carry its citation
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("claims/index.json"))
          claims = d.get("claims", [])
          missing = [c["id"] for c in claims if not c.get("citation")][:10]
          noquote = [c["id"] for c in claims if not c.get("supporting_quote")][:10]
          print(f"{len(claims)} entries")
          if noquote:
              sys.exit("entries without a verbatim supporting_quote, e.g. " +
                       ", ".join(noquote) + "\nAn agent holding only the index could "
                       "then cite the claim restatement but not the source. Run "
                       "tools/enrich_claims_index.py --with-quote.")
          if missing:
              sys.exit("entries without a citation string, e.g. " + ", ".join(missing) +
                       "\nAn index of quotable assertions with no attribution attached is "
                       "the condition under which a model paraphrases without citing. "
                       "Run tools/enrich_claims_index.py.")
          print("every entry is attributable on its own")
          PY

      - name: The SSRN roster and its citation projection must remain complete
        run: |
          python3 - <<'PY'
          import json, re, sys

          papers = json.load(open("papers.json"))
          works = papers.get("works", [])
          ssrn_ids = [w.get("ssrn_id") for w in works]
          bib_entries = re.findall(r"^@\w+\{", open("papers.bib").read(), re.M)

          expected = 133
          problems = []
          if papers.get("count") != expected or len(works) != expected:
              problems.append(f"papers.json roster is {papers.get('count')}/{len(works)}, expected {expected}")
          if papers.get("count_with_ssrn_id") != expected:
              problems.append(f"count_with_ssrn_id is {papers.get('count_with_ssrn_id')}, expected {expected}")
          if any(not value for value in ssrn_ids) or len(set(ssrn_ids)) != expected:
              problems.append("SSRN identifiers are missing or duplicated")
          if len(bib_entries) != expected:
              problems.append(f"papers.bib has {len(bib_entries)} entries, expected {expected}")
          if papers.get("claim_covered_work_count") != 128:
              problems.append("claim_covered_work_count must remain explicit at 128 until ingestion expands")

          if problems:
              sys.exit("\n".join(problems))
          print("133 unique SSRN records; 133 BibTeX entries; 128 claim-covered works")
          PY

      - name: Spot-check that quotes are still verbatim and hashes still bind
        run: python3 verify.py --sample 12 --no-pdf

      - name: Colloquium onboarding contracts and CLI stay executable
        run: |
          python3 tools/build_colloquium_tasks.py --check
          python3 -m unittest tests/test_colloquium_client.py

      - name: Position discovery projections remain exact and fail closed
        run: python3 -m unittest tests/test_position_discoverability.py tests/test_position_notifier.py

      - name: The graph release chain must close
        run: |
          pip install --quiet cryptography
          python3 tools/verify_graph_release.py agentic-claim-graph/v1

      - name: AFMR Lift Harness schemas remain strict and resolvable
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("afmr/schemas")
          expected = {
              "lift-comparison-manifest-v1.schema.json",
              "lift-comparison-public-card-v1.schema.json",
              "lift-comparison-public-card-index-v1.schema.json",
          }
          for name in expected:
              schema = json.loads((root / name).read_text())
              assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              assert schema["$id"].endswith("/afmr/schemas/" + name)
              assert schema["additionalProperties"] is False
          catalog = json.loads((root / "index.json").read_text())
          advertised = {url.rsplit("/", 1)[-1] for url in catalog["schemas"].values()}
          if advertised != expected:
              sys.exit(f"schema catalog drift: {advertised} != {expected}")
          print("AFMR Lift Harness schema catalog OK")
          PY
